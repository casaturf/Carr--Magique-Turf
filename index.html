<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
var today = new Date();
var yyyy = today.getFullYear();
var mm = String(today.getMonth() + 1).padStart(2, '0');
var dd = String(today.getDate()).padStart(2, '0');
var dateStr = yyyy + '-' + mm + '-' + dd;
var fallback = '2026-02-27/index.html';
fetch(dateStr + '/index.html', {method: 'HEAD'})
  .then(function(r) {
    if (r.ok) { window.location.href = dateStr + '/index.html'; }
    else { window.location.href = fallback; }
  })
  .catch(function() { window.location.href = fallback; });
</script>
<noscript><meta http-equiv="refresh" content="0;url=2026-02-27/index.html"></noscript>
</head>
<body><p>Redirection en cours...</p></body>
</html>
