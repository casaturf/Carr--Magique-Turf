<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        // Rediriger vers la date du jour automatiquement
        var today = new Date();
        var yyyy = today.getFullYear();
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var dd = String(today.getDate()).padStart(2, '0');
        var dateStr = yyyy + '-' + mm + '-' + dd;
        
        // Verifier si le dossier existe, sinon chercher le plus recent
        window.location.href = dateStr + '/index.html';
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=2026-02-15/index.html">
    </noscript>
</head>
<body>
    <p>Redirection en cours...</p>
</body>
</html>
